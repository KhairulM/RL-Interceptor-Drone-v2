# SysID from SimpleFlight adapted for Crazyflie 2.1+ using 
# parameters from CrazySim cf2x_L250
# mass from real drone (0.034 kg)
# inertia from CrazySim cf2x_L250 (1.68e-5, 1.68e-5, 2.98e-5)

update_sim: True
name: crazyflie
LPF_coef: 1.0 # low-pass filter, 1.0 means all pass
target_clip: 1.0
min_thrust_ratio: 0.0
max_thrust_ratio: 1.0 # originally 0.9
fixed_yaw: 0
# original diag [1.4e-5, 1.4e-5, 2.17e-5]
inertia:
  xx: 1.68e-5
  xy: 0.0
  xz: 0.0
  yy: 1.68e-5
  yz: 0.0
  zz: 2.98e-5
mass: 0.034 # originally 0.0321
l: 0.096
# Linear body drag: F_drag = -drag_coef * mass * v, applied only when
# use_drag is true. CrazySim (so_rpy_rotor_drag) drag_matrix diag is
# [-0.01471782, -0.01471782, -0.01277641] N/(m/s); using the horizontal
# value: drag_coef = 0.01471782 / mass = 0.461.
# Note: the drag_coef_scale randomization samples from drag_coef regardless
# of use_drag.
use_drag: true
drag_coef: 0.461
rotor_configuration:
  # original arm lengths: [0.043, 0.043, 0.043, 0.043]
  arm_lengths:
  - 0.03253
  - 0.03253
  - 0.03253
  - 0.03253
  directions:
  - -1.0
  - 1.0
  - -1.0
  - 1.0
  force_constants:
  # 1/4mg = (mean_hover_pwm / 2**16) * omega_max^2 * force_constants
  # force_constants = 1/4mg * kf / omega_max^2
  # kf = force_constants * omega_max^2 / 1/4mg
  # - 2.350347298350041e-08 # simopt1
  # - 2.350347298350041e-08
  # - 2.350347298350041e-08
  # - 2.350347298350041e-08
  # - 2.63e-8 # KF=0.155 N/motor, t2w=1.99, ~30% above CrazySim
  # Matched to CrazySim max thrust 0.12 N/motor (t2w=1.53):
  # force_constants = 0.12 / max_rot_vel^2 = 0.12 / 2431^2
  - 2.03e-8
  - 2.03e-8
  - 2.03e-8
  - 2.03e-8
  max_rotation_velocities: # original: [2315, 2315, 2315, 2315]     
  - 2431      # 16mm dc motor -- 14000 rpm/v 3.7V --> 863 rps
  - 2431
  - 2431
  - 2431
  moment_constants:
  # - 7.24e-10 # origin
  # - 7.24e-10
  # - 7.24e-10
  # - 7.24e-10
  # - 8.10e-10 # KM/KF = 0.0308, ~4x too high vs CrazySim thrust2torque=0.00735
  # - 1.49e-10 # KM/KF = 0.00735 from CrazySim thrust2torque param
  # Matched to CrazySim effective KM/KF = 0.006827, evaluated from the
  # rpm2torque polynomial at max RPM (23216): Q = 1.41e-9*rpm + 1.46e-12*rpm^2
  # = 8.19e-4 Nm, ratio = Q / 0.12 N. KM = force_constants * 0.006827
  - 1.386e-10
  - 1.386e-10
  - 1.386e-10
  - 1.386e-10
  num_rotors: 4
  rotor_angles:
  - 0.78539816
  - 2.35619449
  - 3.92699082
  - 5.49778714
  time_constant: 0.1452 # CrazySim tau_up/down = 0.1452 s; per-step lag = 1 - exp(-dt/time_constant)
  noise_scale: 0.0 # default: 2% noise for rotor speed
controller_configuration: # invalid
  gain:
  - 0.0052
  - 0.0052
  - 0.00025