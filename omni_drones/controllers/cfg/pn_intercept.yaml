# Proportional navigation = constant-bearing collision course.
# pursuer_speed [m/s]: pursuer speed capability used to solve the collision
# triangle for the time-to-go. Match the pursuer's achievable cruise speed.
pursuer_speed: 5.5
# nav_gain: multiplier on the collision time-to-go lead. 1.0 is the exact
# constant-bearing course; >1 leads more aggressively (rarely needed).
nav_gain: 1.0
# max_tgo [s]: safety cap on the time-to-go lead (bounds extrapolation of a
# maneuvering evader over long predicted intercepts).
max_tgo: 3.0
