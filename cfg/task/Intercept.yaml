name: Intercept

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  # num_envs: 1
  num_envs: 4096
  max_episode_length: 1000 # 600
  env_spacing: 8


# Curriculum learning parameters
success_radius_init: 0.3
success_radius_end: 0.1
success_radius_lr: 2e-6
success_radius_eval: 0.1

# Reset threshold
reset_thres: 9.0
minimum_altitude: 0.1

reward_distance_scale: 0.8
reward_approach_velocity_weight: 1.0
reward_heading_alignment_weight: 1.0
reward_delta_distance_weight: 10.0
reward_terminal_weight: 100.0
reward_action_smoothness_weight: 0.2
reward_action_norm_weight: 0.5
# Potential-difference precision reward: pays for closing distance, zero when orbiting.
reward_precision_weight: 10.0
reward_precision_scale: 5.0
# Terminal precision reward: pays for being close to the target at the end of the episode.
reward_terminal_precision_weight: 150.0
reward_terminal_precision_scale: 5.0
# FOV reward: +weight when the evader is inside the pursuer camera's field of
# view, -weight when outside (symmetric magnitude; set to 0 to disable).
reward_fov_weight: 0.5
reward_action_body_rate_weight: 0.5

observation:
  include_noise: false
  use_world_frame_pos: false
  use_evader_rel_lin_vel: false
  use_previous_action: true
  use_time_encoding: true
  time_encoding_dim: 4

reward:
  use_delta_distance: true
  use_precision: true
  use_action_smoothness: true
  use_action_body_rate: true
  use_fov: false

action_transform: PIDrate
# action_transform: rate

pursuer:
  model: Crazyflie
  controller: PIDRateController
  # model: Hummingbird
  # controller: RateController
  spawn_pos_range:
    min: [-0.5, -0.5, 0.5]
    max: [0.5, 0.5, 5.0]
  spawn_rpy_range:
    min: [-0.33, -0.33, -1.0]
    max: [0.33, 0.33, 1.0]
  target_speed: 3.0
  initial_velocity:
    enabled: true
    min: [-2.0, -2.0, -2.0, -0.4, -0.4, -0.4]
    max: [2.0, 2.0, 2.0, 0.4, 0.4, 0.4]
  # Forward-facing RGB camera rigidly mounted on the pursuer's base_link.
  # Disabled by default: spawning one render camera per env is expensive, so
  # only enable it for a small num_envs (visualization / data collection).
  camera:
    enabled: false
    resolution: [320, 320]        # width, height (px)
    fov: 87.0          # field of view (deg); square resolution -> equal h/v FOV
    fps: 30                        # sensor update rate (Hz)
    translation: [0.028, 0.0, 0.014]  # mount offset from base_link (m): +28mm x, +14mm z
    rotation: [0.0, 0.0, 0.0]      # mount orientation [roll, pitch, yaw] (deg); [0,0,0] faces +x forward

evader:
  model: Crazyflie
  # model: Hummingbird
  controller: LeePositionController
  speed_range: [0.0, 6.0]
  spawn_distance_range: [0.5, 7.0]
  trajectory_types: [hover, linear, random] # for training
  # trajectory_types: [random] # for evaluation
  random:
    turn_interval_range: [20, 80]
    vertical_component_range: [-0.5, 0.5]
    target_lookahead: 0.5
  frpn:
    gain: 5.0
    position_blend: 0.2
    min_relative_speed: 0.1
    max_time_to_go: 2.0
    target_lookahead: 0.5
    max_speed: 3.0
  apf:
    pursuer_gain: 1.0
    pursuer_power: 3.0
    containment_radius: 3.5
    containment_gain: 1.0
    target_lookahead: 0.5
    max_speed: 3.0
  initial_velocity:
    enabled: true
    min: [-2.0, -2.0, -2.0, -0.4, -0.4, -0.4]
    max: [2.0, 2.0, 2.0, 0.4, 0.4, 0.4]

# Domain randomization for the RL-controlled pursuer.
randomization:
  pursuer:
    train:
      mass_scale: [0.95, 1.05]
      t2w_scale: [0.85, 1.15]
      inertia_scale: [0.90, 1.10]
      tau_up: [0.08, 0.17]
      tau_down: [0.08, 0.17]
    # eval:
    #   mass_scale: [0.95, 1.10]
    #   t2w_scale: [0.95, 1.15]
    #   tau_up: [0.05, 0.10]
    #   tau_down: [0.05, 0.10]

