name: Intercept

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 4096
  max_episode_length: 1000 # 600
  env_spacing: 8

time_encoding_dim: 4

# Curriculum learning parameters
success_radius_init: 0.3
success_radius_max: 0.1
success_radius_lr: 2e-6
success_radius_eval: 0.15

# Reset threshold
reset_thres: 9.0
minimum_altitude: 0.15

reward_distance_scale: 0.8
reward_approach_velocity_weight: 1.0
reward_heading_alignment_weight: 1.0
reward_action_smoothness_weight: 0.5
reward_delta_distance_weight: 10.0
# Potential-difference precision reward: pays for closing distance, zero when orbiting.
reward_precision_weight: 10.0
reward_precision_scale: 5.0
reward_terminal_weight: 100.0
reward_action_norm_weight: 0.5

observation:
  include_noise: false
  use_world_frame_pos: false
  include_rot_speed: false
  include_evader_rel_lin_vel: false

action_transform: PIDrate

pursuer:
  model: Crazyflie
  controller: PIDRateController
  spawn_pos_range:
    min: [-0.5, -0.5, 1.3]
    max: [0.5, 0.5, 1.9]
  spawn_rpy_range:
    min: [-0.15, -0.15, -0.25]
    max: [0.15, 0.15, 0.25]
  target_speed: 10.0
  use_rot_speed: false
  use_ab_world_frame: false

evader:
  model: Crazyflie
  controller: LeePositionController
  speed_range: [1.0, 6.0]
  spawn_distance_range: [1.0, 7.0]
  trajectory_types: [hover, linear, zigzag] # for training
  zigzag:
    amplitude_range: [1.0, 3.0]
    frequency_range: [0.3, 1.0]
  random:
    turn_interval_range: [20, 80]
    vertical_component_range: [-0.2, 0.2]
    target_lookahead: 0.5
  use_relative_velocity: false

  # VO curriculum: each param ramps linearly init→max over training via `lr`.
  vo_curriculum:
    time_horizon:
      init: 1.0
      max: 5.0
      lr: 2e-6
    inflation_radius:
      init: 0.0
      max: 0.3
      lr: 5e-8
    max_velocity:
      init: 3.0
      max: 10.0
      lr: 3e-7
    n_directions:
      init: 32
      max: 256
      lr: 2e-6

# Domain randomization for the RL-controlled pursuer.
randomization:
  pursuer:
    train:
      mass_scale: [0.95, 1.05]
      t2w_scale: [0.90, 1.15]
      inertia_scale: [0.90, 1.15]
      # tau_up: [0.05, 0.10]
      # tau_down: [0.05, 0.10]
    # eval:
    #   mass_scale: [0.95, 1.10]
    #   t2w_scale: [0.95, 1.15]
    #   tau_up: [0.05, 0.10]
    #   tau_down: [0.05, 0.10]

