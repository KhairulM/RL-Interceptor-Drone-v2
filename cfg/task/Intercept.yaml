name: Intercept

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 4096
  max_episode_length: 600
  env_spacing: 8

# drone_model:
#   name: Hummingbird
#   controller: RateController

time_encoding_dim: 4

reset_thres: 15.0
success_radius: 0.3
reward_distance_scale: 0.8
reward_approach_velocity_weight: 1.0
reward_action_smoothness_weight: 0.1
reward_heading_alignment_weight: 1.0
reward_delta_distance_weight: 10.0
reward_terminal_weight: 100.0

# action_transform: rate
action_transform: PIDrate

pursuer:
  # model: Hummingbird
  # controller: RateController
  model: Crazyflie
  controller: PIDRateController
  spawn_pos_range:
    min: [-0.5, -0.5, 1.3]
    max: [0.5, 0.5, 1.9]
  spawn_rpy_range:
    min: [-0.15, -0.15, -0.25]
    max: [0.15, 0.15, 0.25]
  target_speed: 10.0
  use_rot_speed: false
  use_ab_world_frame: false

evader:
  # model: Crazyflie
  # controller: LeePositionController
  model: Crazyflie
  controller: LeePositionController
  # speed: 5.0
  # trajectory:
    # type: circular
    # radius: 5.0
    # ang_vel: 1.0
    # type: hover
    # type: linear
    # speed: 5.0
  # trajectories:
  #   - type: hover
  #   - type: circular
  #     radius: 1.0
  #     ang_vel: 1.0
  #   - type: linear
  #     speed: 5.0
  speed_range: [2.0, 10.0]
  spawn_distance_range: [2.0, 7.0]
  # Each env samples uniformly from this list of enabled trajectory types
  # on every reset. Supported: "linear", "zigzag", "velocity_obstacle", "random".
  # trajectory_types: [linear, zigzag, random]
  trajectory_types: [linear, zigzag] # for training
  # trajectory_types: [random] # for generalization evaluation
  # trajectory_types: [velocity_obstacle]
  zigzag:
    amplitude_range: [1.0, 3.0]
    frequency_range: [0.3, 1.0]
  random:
    turn_interval_range: [20, 80]
    vertical_component_range: [-0.2, 0.2]
    target_lookahead: 0.5
  # boundary_mode: bounce
  # bounds:
  #   min: [-6.0, -6.0, 1.0]
  #   max: [6.0, 6.0, 4.0]
  use_relative_velocity: false

# Domain randomization applied to the (RL-controlled) pursuer drone.
# The force constant KF is randomized via `t2w_scale`: on every reset the
# rotor thrust-to-weight is sampled uniformly from THRUST2WEIGHT_0 * [lo, hi],
# which sets KF = t2w * mass * 9.81 (see multirotor._randomize).
# `train`/`eval` phases are selected automatically by env.training.
randomization:
  pursuer:
    train:
      t2w_scale: [0.95, 1.05]

