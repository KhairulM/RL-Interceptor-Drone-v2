name: InterceptCompetitive
defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_
env:
  num_envs: 128
  max_episode_length: 600
  env_spacing: 8
  
time_encoding_dim: 4
include_rel_opp_vel: false
include_pursuer_rel_goal_heading: false
reset_thres: 15.0
reward_approach_velocity_weight: 1.0
action_transform: null
ravel_obs: false
ravel_obs_central: false
capture_radius: 0.5
goal_radius: 0.5
crash_alt: 0.15
crash_penalty: 5.0
terminal_reward: 10.0
zero_sum_dense: false
evader_goal_reward_scale: 0.8
evader_evade_bonus: 0.1
goal_pos_range:
  min: [-3.0, -3.0, 1.0]
  max: [3.0, 3.0, 3.0]
pursuer:
  model: Hummingbird
  controller: RateController
  spawn_pos_range:
    min: [-0.5, -0.5, 1.3]
    max: [0.5, 0.5, 1.9]
  spawn_rpy_range:
    min: [-0.15, -0.15, -0.25]
    max: [0.15, 0.15, 0.25]
  target_speed: 20.0
evader:
  model: Hummingbird
  spawn_distance_range: [4.0, 7.0]
