name: InterceptCompetitiveMA

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 4096
  max_episode_length: 1000
  env_spacing: 8

reset_thres: 9.0

# Success radius curriculum (same as original Intercept)
success_radius_init: 0.3
success_radius_max: 0.1
success_radius_lr: 2e-6
success_radius_eval: 0.15

# Reward weights
reward_heading_alignment_weight: 1.0
reward_delta_distance_weight: 10.0
reward_terminal_weight: 100.0

pursuer:
  model: Crazyflie
  controller: PIDRateController
  target_speed: 10.0
  spawn_pos_range:
    min: [-0.5, -0.5, 1.3]
    max: [0.5, 0.5, 1.9]
  spawn_rpy_range:
    min: [-0.15, -0.15, -0.25]
    max: [0.15, 0.15, 0.25]

evader:
  model: Crazyflie
  spawn_distance_range: [1.0, 7.0]

randomization:
  pursuer:
    train:
      mass_scale: [0.95, 1.15]
      t2w_scale: [0.95, 1.15]
      inertia_scale: [0.95, 1.15]
  evader:
    train:
      mass_scale: [0.95, 1.15]
      t2w_scale: [0.95, 1.15]
      inertia_scale: [0.95, 1.15]
