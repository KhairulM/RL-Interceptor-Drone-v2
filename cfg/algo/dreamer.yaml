name: dreamer

# DreamerV3 paper defaults (Hafner et al. 2023, Table W.1 / Appendix B).
# Universal config; the paper deliberately uses the same hyperparameters
# across all 150+ tasks. The "size-S 12M" model is reproduced here.

encoder:
  hidden_units: [512, 512]
  layer_norm: true
  proj_units: [512]

decoder:
  hidden_units: [512, 512]

world_model:
  deter_dim: 512
  stoch_dim: 32
  discrete_dim: 32
  hidden_units: [512]          # cat([stoch, action]) -> gru_input
  prior_hidden_units: [512]    # gru_output -> prior_logits
  post_hidden_units: [512]     # cat([embed, deter]) -> post_logits
  lr: 1e-4
  kl_free: 1.0                 # nats, applied per latent

actor:
  hidden_units: [512, 512]
  lr: 3e-5
critic:
  dist: normal
  value_pred_dist: twohot_symlog
  hidden_units: [512, 512]
  lr: 3e-5

reward_pred:
  dist: twohot_symlog
  hidden_units: [512, 512]
discount_pred:
  hidden_units: [512, 512]

discount: 0.997                # ~333-step effective horizon
gradient_steps: 64
buffer_size: 2048              # x num_envs frames (~1M with 512 envs)
train_every: 64
batch_size: 16
batch_length: 64

max_grad_norm: 100             # actor & critic; WM uses 1000 in paper
return_lambda: 0.95
imag_horizon: 15
actor_grad: dynamics
actor_entropy_coeff: 3e-4

slow_critic_tau: 0.02
checkpoint_path: null
