# Intercept controller configuration.
#
# All runtime settings for intercept_controller.py live here (no CLI flags).
# Run with:  python intercept_controller.py [--config intercept_config.yaml]
# Any key omitted below falls back to the documented default.

artifact_dir: artifacts/intercept_ppo_crazyflie_v8.16_no_reset_dist  # Folder with policy_ts.pt + metadata.json (required).

# -- Controller runtime -----------------------------------------------------
controller:
  evader_source: cf            # cf | scripted.
  control_dt: 0.02             # 0 = use pursuer config or policy dt.
  takeoff_height: 1.0          # Takeoff height for both drones (m).
  takeoff_duration: 3.0        # Takeoff duration for both drones (s).
  state_timeout: 0.5           # Stop if pursuer state is stale this long (s).
  min_altitude: 0.15           # Safety cutoff altitude (m).
  log_commands: true          # Print decoded CTBR commands.
  publish_tf: true            # Also publish mocap poses on the ROS 2 /tf tree.
  mocap_world_frame: world     # Parent frame id for published TF transforms.
  evader_motion:
    type: linear                # hover | linear | random | trajectory (legacy CSV).
    yaw_deg: 0.0               # Yaw command for evader position setpoints (deg).
    anchor: [2.0, 0.0, 1.0]    # Initial position / hover point [x, y, z] (m).
    trajectory_file: 'trajectories/linear_y.csv'        # CSV path (absolute or relative to this config).
    trajectory_loop: true      # Loop the trajectory when reaching the end.
    linear:
      speed: 2.0              # Constant speed (m/s).
      direction: [1.0, 0.0, 0.0]  # World-frame travel direction; normalized at load.
    random:
      speed: 2.0              # Random-motion speed (m/s).
      turn_interval_range: [20, 80]  # Controller ticks between heading changes.
      vertical_component_range: [-0.5, 0.5]  # Sampled z component before normalization.
      target_lookahead: 0.5    # Position-controller target lead distance (s).
      seed: null               # Optional RNG seed for repeatable random motion.

# -- Pursuer drone config ----------------------------------------------------
pursuer:
  name: pursuer
  # uri: radio://0/40/2M/E7E7E7E701      # Crazyflie URI of the pursuer.
  uri: udp://127.0.0.1:19850
  cache_dir: ./cache-pursuer                    # cflib read/write cache directory.
  control_dt: 0.02                 # 0 = use the policy's training dt.
  log_period_ms: 20                 # Log decoded body rates + thrust every N ms (0 = disable).
  max_thrust_pwm: 65535.0              # Upper clamp on commanded thrust (0..65535).
  rate_sign: [1.0, 1.0, 1.0]           # Per-axis sign flips: [roll, pitch, yaw].
  state_timeout: 0.1                   # Stop if state is stale this long (s).
  min_altitude: 0.1                   # Safety cutoff altitude (m).


# -- Evader drone config -----------------------------------------------------
evader:
  name: evader
  # uri: radio://1/80/2M/E7E7E7E702    # Evader Crazyflie URI (when source == cf).
  uri: udp://127.0.0.1:19851
  cache_dir: ./cache-evader                    # cflib read/write cache directory.
  control_dt: 0.02                 # 0 = use the policy's training dt.
  log_period_ms: 20                 # Log decoded body rates + thrust every N ms (0 = disable).
  max_thrust_pwm: 65535.0              # Upper clamp on commanded thrust (0..65535).
  rate_sign: [1.0, 1.0, 1.0]           # Per-axis sign flips: [roll, pitch, yaw].

# -- Trajectory logging ------------------------------------------------------
trajectory:
  save: true
  dir: ./trajectory_logs
  prefix: intercept

# -- Motion capture (OptiTrack / NatNet) -------------------------------------
mocap:
  enabled: true
  server_ip: 192.168.0.210           # Motive/NatNet server IP.
  local_ip: ""                       # Local NIC IP for multicast ("" = auto-detect).
  multicast_address: 239.255.42.99           # NatNet multicast group address.
  command_port: 1510
  data_port: 1511
  # Body-frame correction quaternion [qx, qy, qz, qw] mapping Motive -> ROS FLU.
  body_to_flu_quat_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  # body_to_flu_quat_xyzw: [0.0, 0.0, 1.0, 0.0]
  
  pursuer_rigid_body_id: 31
  evader_rigid_body_id: 32
  mocap_send_rate_hz: 60.0
  world_frame: world                 # Parent frame id for published TF transforms.
  orientation_align_time: 2.0     # Time to align mocap orientation with EKF (s). Mocap will publish position + orientation first before publishing only position.

# -- Classical baselines (traditional_controller.py) -------------------------
# Only read by traditional_controller.py; intercept_controller_v2.py ignores
# this section. Run with:  python traditional_controller.py --method pn
traditional:
  method: pure_pursuit         # pure_pursuit | pn | apf | nonlinear_mpc.

  # Shared CTBR calibration + geometric outer-loop gains.
  ctbr:
    # Normalised collective thrust (thrust_pwm / 65536) at which the pursuer
    # holds altitude. THE one value to calibrate on a real airframe; the
    # default is the sim Crazyflie rotor model (m=0.034 kg, 0.12 N/rotor,
    # thrust-to-weight ~1.44).
    hover_throttle: 0.8336
    gravity: 9.81
    # Command envelope. Omitted keys are inherited from the exported policy's
    # metadata.json (when artifact_dir exists) so the baseline and the policy
    # command through identical scaling.
    # target_clip: 1.0
    # min_thrust_ratio: 0.0
    # max_thrust_ratio: 1.0
    kp: 8.0                    # Outer position P gain.
    kv: 7.0                    # Outer velocity P gain (kv >= kp = well damped).
    k_att: 6.0                 # Thrust-vector alignment gain -> body rates.
    k_yaw: 1.0                 # Yaw alignment gain.
    max_tilt_deg: 28.0         # Tilt clamp; higher bleeds altitude on this T/W.
    ki_z: 10.0                 # Altitude integral (nulls hover-throttle error).
    i_limit_z: 1.0             # Anti-windup clamp on the altitude integral.
    i_speed_gate: 1.5          # Only integrate below this speed (m/s).

  pure_pursuit: {}             # No tunables: chases the evader's position.

  pn:
    pursuer_speed: 2.0         # Speed capability used to solve the collision triangle (m/s).
    nav_gain: 1.0              # Lead multiplier; 1.0 = exact constant-bearing course.
    max_tgo: 3.0               # Cap on the time-to-go lead (s).

  apf:
    attract_gain: 2.0          # Attractive-well strength (1/s).
    max_speed: 2.0             # Cap on the field velocity magnitude (m/s).
    decel: 2.0                 # Usable braking; caps speed at sqrt(2*decel*range).
    vel_feedforward: true      # Add the evader velocity so the field tracks a mover.

  nonlinear_mpc:               # Sampling-based MPPI over the full 6-DOF model.
    horizon: 20                # Plan steps; lookahead = horizon*step_mult*control_dt.
    step_mult: 2               # Plan step = step_mult * control_dt.
    num_samples: 256           # Rollouts per solve; cut this first if the loop overruns.
    temperature: 0.05          # Lower = greedier averaging of the rollouts.
    discount: 0.99
    noise_rate: 0.5            # Body-rate sampling noise std (rad/s).
    noise_thrust: 1.0          # Thrust-accel sampling noise std (m/s^2).
    noise_smooth: 8            # Moving-average window on the noise (smooth-MPPI).
    rate_tau: 0.10             # Modelled body-rate actuator lag (s).
    thrust_tau: 0.12           # Modelled thrust actuator lag (s).
    w_dist: 2.0
    w_terminal: 10.0
    w_closing: 30.0            # Reward on line-of-sight closing speed.
    max_closing: 6.0           # Cap on the rewarded closing speed (m/s).
    closing_decel: 50.0        # Brake-limited cap: sqrt(2*closing_decel*range).
    w_rate: 0.3
    w_smooth: 2.0              # Penalty on step-to-step body-rate change.
    w_tilt: 3.0
    w_ground: 150.0            # Floor barrier weight.
    min_altitude: 0.4          # Altitude the floor barrier defends (m).
    w_alt: 8.0                 # Penalty for dropping below the target's altitude.
    ta_min_frac: 0.6           # Thrust-accel floor as a fraction of g.
    tilt_max: 32.0             # Near-hard tilt barrier (deg).
    w_tilt_barrier: 3000.0
