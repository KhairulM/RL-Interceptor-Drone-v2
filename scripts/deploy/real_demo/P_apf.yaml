# GENERATED by real_demo/make_configs.py from config_real.yaml; do not edit (edit the base and rerun).
# Condition P: scripted APF evader.
# PursuitEvasion controller configuration (pursuit_evasion_controller.py).
# REAL Crazyflies: F14 RLS seed-200 pursuer vs the same campaign's final evader, OptiTrack mocap.
# config_pursuit_evasion.yaml documents every key.
# Run with:  python pursuit_evasion_controller.py --config config_real_f14.yaml

policy:
  artifact_dir: artifacts/thesis_F23_rls_s100/pursuer   # estimator + RLS, obs 31

opponent:
  mode: scripted
  scripted:
    type: apf                  # artificial potential field evader (pursuit_evasion_controller.apf_evader_velocity)
    virtual: false
    speed: 2.0                 # m/s, maximum (the training flee heuristic's speed)
    lookahead: 0.5             # s, setpoint lead
    apf_influence: 3.0         # m, repulsion from the pursuer within this distance (start separation: 2 m)
    apf_wall_margin: 1.0       # m, repulsion from the walls within this distance
    apf_wall_gain: 2.0
    apf_vortex_gain: 1.0       # sideways push around the pursuer (escapes the wall stall)

arena:
  origin: [0.0, 1.0, 0.0]      # Arena centre on the floor, in mocap world coordinates (check in Motive).
  scripted_margin: 0.3

episode:
  stop_on_capture: true
  capture_radius: 0.125         # m, the crazyflie is trained with 0.1m but the mocap data can be delayed so we increased the capture radius here
  stop_on_evader_exit: true
  stop_on_timeout: true        # end at the training episode length (30 s) = "timeout" outcome
  state_timeout: 0.5
  min_altitude: 0.10

flight:
  takeoff_height: 1.0
  takeoff_duration: 3.0
  land_duration: 3.0
  firmware_thrust_base: null   # keep the firmware's value on the real drones (see config_pursuit_evasion.yaml)
  control_dt: 0.0
  command_rate_lpf_tau: 0.03   # s; smooths the body-rate commands (CrazySim 2026-11-24: the only captures)

logging:
  log_commands: true
  debug_obs: false             # true prints the estimator output (opp_acc/10(body))
  debug_period_s: 0.5
  publish_tf: true
  csv_dir: logs/flights         # one CSV + JSON per flight (flight_log.py)

pursuer:
  name: pursuer
  uri: radio://0/80/2M/E7E7E7E701
  cache_dir: ./cache-pursuer
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, -1.0]  # [roll, pitch, yaw]; the firmware negates yaw in the legacy setpoint packet
  state_timeout: 0.1
  min_altitude: 0.1

evader:
  name: evader
  uri: radio://1/40/2M/E7E7E7E702
  cache_dir: ./cache-evader
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, -1.0]  # [roll, pitch, yaw]; the firmware negates yaw in the legacy setpoint packet
  state_timeout: 0.1
  min_altitude: 0.1

mocap:
  enabled: true
  server_ip: 192.168.0.210
  local_ip: ""
  multicast_address: 239.255.42.99
  command_port: 1510
  data_port: 1511
  body_to_flu_quat_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  pursuer_rigid_body_id: 32
  evader_rigid_body_id: 33
  mocap_send_rate_hz: 60.0
  world_frame: world
  orientation_align_time: 2.0

# Safety layer (safety.py; SAFETY_PLAN.md). Omitted keys use the safety.py defaults
# (tilt > 60 deg or body rate > 720 deg/s -> motors off on that drone; speed > 6 m/s -> land).
safety:
  enabled: true
  strict_preflight: true        # no take-off without mocap alignment, estimator convergence, both drones in the arena
  evader_geofence_margin: 0.3   # m past the arena walls / ceiling; the lab has about 0.1-0.2 m
  pursuer_geofence_margin: 0.3  # m, same limit: the pursuer climbs toward the ceiling in most CrazySim runs
  stop_lookahead_s: 0.3         # predicted position outside the fence -> HOLD
  min_separation: 0.0           # m; 0 = off, the capture stop at 0.10 m ends the run
  mocap_timeout: 0.5            # s without an accepted mocap frame for a drone -> HOLD
  mocap_land_after: 0.5         # s after the last accepted mocap frame for a drone -> LAND
  inject: {kind: none, at_s: 5.0}
