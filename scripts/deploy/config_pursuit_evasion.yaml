# PursuitEvasion controller configuration (pursuit_evasion_controller.py).
#
# Run with:  python pursuit_evasion_controller.py [--config config_pursuit_evasion.yaml]
# Paths are relative to the working directory (run from scripts/deploy).
# Any key omitted falls back to the default shown in the controller's config
# dataclasses; unknown keys are an error.
#
# Sections
#   policy    the learned drone this controller flies
#   opponent  how the other drone is driven
#   arena     where the trained arena sits in the mocap world
#   episode   when a run ends (mirrors the training episode endings)
#   flight    take-off, landing and the control loop
#   logging   console output and ROS 2 TF
#   pursuer / evader   per-drone radio settings, keyed by role
#   mocap     OptiTrack / NatNet
#   safety    the safety layer (safety.py; SAFETY_PLAN.md)

# -- Policy -------------------------------------------------------------------
policy:
  # Folder with policy_ts.pt + metadata.json (+ esn.pt / adapter_basis.pt when the
  # policy observes an estimator). Its metadata role (pursuer | evader) picks
  # which drone section below is "self".
  # F14 Stage E RLS, seed 200, stage 24: learned evader-acceleration estimate +
  # online RLS (obs 31). See artifacts/thesis_F14_rls_s200/README.md.
  artifact_dir: artifacts/thesis_F23_rls_s100/pursuer

# -- Opponent -----------------------------------------------------------------
opponent:
  mode: policy                 # policy | cf | scripted
  # mode: policy  -> artifact of the OPPOSING role (here the same campaign's
  # final evader, stage 25).
  artifact_dir: artifacts/thesis_F23_rls_s100/evader
  # mode: policy only: hand the opponent drone to a second policy during the run (the thesis
  # switching evaders). The new policy keeps the drone's previous action. null = no switch.
  # F8 -> F10: artifact_dir = artifacts/thesis_F8_roncero_s0/evader and
  #   switch: {artifact_dir: artifacts/thesis_F10_nofix_s0/evader, after_s: 1.0}
  # (after_s: s after the chase starts; thesis 0.5, 1.0 or 1.5). Swap the two for F10 -> F8.
  # switch: {artifact_dir: artifacts/thesis_F10_nofix_s0/evader, after_s: 2.0}
  switch: null
  # mode: cf  -> a real Crazyflie tracked by mocap but flown by something else.
  # mode: scripted  -> the opponent Crazyflie takes off and flies position setpoints:
  scripted:
    type: apf               # hover | linear | circular | pure_pursuit | flee | apf
    virtual: false             # true: no opponent drone; the agent chases a virtual point.
    yaw_deg: 0.0               # Yaw of every setpoint (deg).
    anchor: [0.5, 0.0, 1.0]    # Start / hover point [x, y, z] (m, mocap world); flee holds this z.
    speed: 2.0                 # linear / flee speed, apf maximum speed (m/s).
    direction: [1.0, 0.0, 0.0] # linear: world-frame travel direction (normalised at load).
    radius: 1.0                # circular: orbit radius (m).
    omega: 1.0                 # circular: angular rate (rad/s).
    lookahead: 0.5             # flee / apf: setpoint lead time (s).
    apf_influence: 3.0         # apf: repulsion from the agent within this distance (m; start separation 2 m).
    apf_wall_margin: 1.0       # apf: repulsion from the walls within this distance (m).
    apf_wall_gain: 2.0         # apf: wall repulsion strength relative to the agent's.
    apf_vortex_gain: 1.0       # apf: sideways (counter-clockwise) share of the agent push; 0 = plain APF.

# -- Arena --------------------------------------------------------------------
# Size comes from the policy metadata (arena_half_xy, arena_z_min/max).
arena:
  origin: [0.0, 0.0, 0.0]      # Arena centre in mocap world coordinates; the policy
                               # observes positions relative to it.
  scripted_margin: 0.3         # Keep scripted setpoints this far inside the walls (m).

# -- Episode ------------------------------------------------------------------
episode:
  stop_on_capture: true        # Stop once the drones are within capture_radius.
  capture_radius: 0.125          # m; 0 = the trained radius from the metadata.
  stop_on_evader_exit: true    # Stop if the EVADER leaves the arena (episode end in
                               # training); the pursuer may leave freely.
  stop_on_timeout: false       # Stop after the training episode length
                               # (metadata.max_episode_length * ctbr.dt; evader win).
  state_timeout: 0.5           # s; stop if a drone's state is this stale.
  min_altitude: 0.10           # m; stop if a drone is lower.

# -- Flight -------------------------------------------------------------------
flight:
  takeoff_height: 1.0          # m, both drones.
  takeoff_duration: 3.0        # s.
  land_duration: 3.0           # s.
  land_speed: 0.5              # m/s average descent: landing time = max(land_duration, (z - 0.1) / land_speed).
  brake_decel: 2.0             # m/s^2: moving drones are slowed to rest at this rate before a hold / landing.
  firmware_thrust_base: 45000  # posCtlPid.thrustBase (PWM). CrazySim cf2x_L250 hovers at ~45000; null on real drones
                               # keeps the firmware's 36000 (stock Crazyflie).
  control_dt: 0.0              # s; 0 = the policy's training period (metadata.ctbr.dt).
  # Low-pass time constant (s) on the commanded body rates; 0 = off. The firmware
  # rate loop is ~10x faster than the 50 Hz training loop and can turn aggressive
  # rate commands into roll oscillation; try 0.02-0.05 if you see it.
  command_rate_lpf_tau: 0.03

# -- Logging ------------------------------------------------------------------
logging:
  log_commands: true           # One line per tick: altitude, distance, CTBR command.
  debug_obs: false             # Dump raw states + named observation components
                               # (incl. the estimator output) to compare deploy vs sim.
  debug_period_s: 0.5          # Min seconds between debug_obs dumps.
  publish_tf: true             # Publish mocap poses on /tf (parent: mocap.world_frame).
  csv_dir: null                # Folder for one CSV (row per tick) + JSON sidecar per flight; null = off.

# -- Pursuer drone config ----------------------------------------------------
pursuer:
  name: pursuer
  # uri: radio://0/40/2M/E7E7E7E701
  uri: udp://127.0.0.1:19850
  cache_dir: ./cache-pursuer
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, -1.0]  # [roll, pitch, yaw]; the firmware negates yaw in the legacy setpoint packet
  state_timeout: 0.1
  min_altitude: 0.1

# -- Evader drone config -----------------------------------------------------
evader:
  name: evader
  # uri: radio://1/80/2M/E7E7E7E702
  uri: udp://127.0.0.1:19851
  cache_dir: ./cache-evader
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, -1.0]  # [roll, pitch, yaw]; the firmware negates yaw in the legacy setpoint packet
  state_timeout: 0.1
  min_altitude: 0.1

# -- Motion capture (OptiTrack / NatNet) -------------------------------------
mocap:
  enabled: false
  server_ip: 192.168.0.210
  local_ip: ""
  multicast_address: 239.255.42.99
  command_port: 1510
  data_port: 1511
  body_to_flu_quat_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  pursuer_rigid_body_id: 31
  evader_rigid_body_id: 32
  mocap_send_rate_hz: 60.0
  world_frame: world
  orientation_align_time: 2.0

# -- Safety layer (safety.py; SAFETY_PLAN.md) ---------------------------------
# Checked every control tick for both drones. Responses: HOLD (hover in place for hold_s, then land),
# LAND (both drones land at the same time), EMERGENCY (motors off on the affected drone, the other lands).
safety:
  enabled: true
  strict_preflight: false        # refuse to take off if mocap is not aligned / the estimator has not converged /
                                # a drone starts outside the arena, not level or with a stale / non-finite state
  evader_geofence_margin: 0.3   # evader's hard fence = arena + margin (incl. ceiling) -> LAND
  pursuer_geofence_margin: 0.3  # pursuer's fence; null = none (training lets the pursuer leave the arena).
                                # Set to the room the lab has beyond the arena walls and below the ceiling.
  stop_lookahead_s: 0.3         # predicted position (p + v * t) outside the fence -> HOLD
  min_altitude: 0.10            # -> EMERGENCY (motors off); also checked throughout shutdown
  max_descent_speed: 2.5        # m/s below descent_check_alt -> HOLD (brake; motors-off would hit harder)
  descent_check_alt: 0.6
  max_tilt_deg: 60.0            # -> EMERGENCY
  max_body_rate_deg: 720.0      # -> EMERGENCY
  max_speed: 6.0                # m/s -> LAND
  min_separation: 0.0           # m, 0 = off (rely on the capture stop); e.g. 0.20 on hardware -> HOLD
  telemetry_timeout: 0.1        # s without state packets from a drone -> HOLD
  telemetry_land_after: 0.3     # -> LAND
  mocap_timeout: 0.5            # s without an accepted mocap frame for a drone -> HOLD
  mocap_land_after: 0.5         # -> LAND
  mocap_max_rejects: 5          # consecutive implausible mocap frames (jumps) -> HOLD
  mocap_max_speed: 5.0          # m/s, jump gate: |dp| > v * dt + mocap_jump_tol is rejected
  mocap_jump_tol: 0.05
  mocap_swap_tol: 0.05          # a body reading where the other body was -> swap suspected -> LAND
  hold_s: 1.0
  inject: {kind: none, at_s: 5.0}   # simulator only: stale_opponent | nan_action | position_jump | tilt
