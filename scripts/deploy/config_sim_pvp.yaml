# PursuitEvasion controller configuration (pursuit_evasion_controller.py).
# CrazySim variant; config_pursuit_evasion.yaml documents every key.
# Run with:  python pursuit_evasion_controller.py --config config_sim_pvp.yaml

policy:
  artifact_dir: artifacts/pe_pursuer_v2_stage10   # pursuer_stage10 (all fixes)

opponent:
  mode: policy                 # policy | cf | scripted
  artifact_dir: artifacts/pe_evader_v2_stage11   # trained evader (co-evolved)
  scripted:
    type: hover
    yaw_deg: 0.0
    anchor: [2.0, 0.0, 1.0]
    speed: 1.0
    direction: [1.0, 0.0, 0.0]
    radius: 1.5
    omega: 1.0
    lookahead: 0.5

arena:
  origin: [0.0, 0.0, 0.0]
  scripted_margin: 0.3

episode:
  stop_on_capture: true
  capture_radius: 0.2          # looser than the trained 0.1 for a sim capture event
  stop_on_evader_exit: true
  state_timeout: 0.5
  min_altitude: 0.15

flight:
  takeoff_height: 1.0
  takeoff_duration: 3.0
  control_dt: 0.0
  command_rate_lpf_tau: 0.0

logging:
  log_commands: true
  debug_obs: false
  debug_period_s: 0.5
  publish_tf: true

# -- Pursuer drone config ----------------------------------------------------
pursuer:
  name: pursuer
  # uri: radio://0/40/2M/E7E7E7E701
  uri: udp://127.0.0.1:19850
  cache_dir: ./cache-pursuer
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, 1.0]
  state_timeout: 0.1
  min_altitude: 0.1

# -- Evader drone config -----------------------------------------------------
evader:
  name: evader
  # uri: radio://1/80/2M/E7E7E7E702
  uri: udp://127.0.0.1:19851
  cache_dir: ./cache-evader
  control_dt: 0.02
  log_period_ms: 20
  max_thrust_pwm: 65535.0
  rate_sign: [1.0, 1.0, 1.0]
  state_timeout: 0.1
  min_altitude: 0.1

# -- Motion capture (OptiTrack / NatNet) -------------------------------------
mocap:
  enabled: false
  server_ip: 192.168.0.210
  local_ip: ""
  multicast_address: 239.255.42.99
  command_port: 1510
  data_port: 1511
  body_to_flu_quat_xyzw: [0.0, 0.0, -0.7071067811865476, 0.7071067811865476]
  pursuer_rigid_body_id: 31
  evader_rigid_body_id: 32
  mocap_send_rate_hz: 60.0
  world_frame: world
  orientation_align_time: 2.0
