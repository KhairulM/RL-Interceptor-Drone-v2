# Orchestrator config for population-based self-play pursuit-evasion.
# Plain OmegaConf (not Hydra); override on the CLI as key=value, e.g.
#   python scripts/selfplay/train_selfplay.py n_stages=8 temperature=0.5

# Version name of this campaign. DB/checkpoints/stage artifacts go under
# scripts/selfplay/outputs/{run_name}/{db,checkpoints,stages}; wandb runs are
# named {run_name}-{pursuer|evader}-stage{n}.
run_name: v11-uniform-mix

# Fresh start: wipe db_dir/ckpt_dir/work_dir on launch and re-seed heuristics.
# false (default) resumes the next incomplete stage and extends the population.
fresh_start: false

# Worker wiring.
python: null                       # python executable; null -> sys.executable
task: PursuitEvasion
algo: ppo
num_envs: 4096
headless: true
worker_retries: 2                  # relaunch a crashed worker (flaky Isaac SIGSEGV) this many times
# Extra hydra overrides forwarded to every worker (train and eval), e.g.
#   task_overrides: [task.esn.enabled=true]
# ESN changes obs_dim, so use fresh db/ckpt dirs when toggling it.
task_overrides: []

# Generational loop.
n_stages: 13
start_role: pursuer                # side trained first
frames_per_stage: 500_000_000
warm_start: true                   # init each policy from latest same-role policy
seed: 0
wandb_mode: online                 # per-stage wandb logging; set 'disabled' to turn off
# Opponent sampling (this method's extension of the paper's win-rate Hedge):
# First RL policy per role: uniform scripted opponents. Later: RL-only opponents
# with a uniform/temperature-scaled softmax mixture over a multi-metric hardness score.
temperature: 0.9
uniform_mix: 0.5                   # [0, 1]: 0 = pure softmax, 1 = fully uniform

metric_weights:
  win_rate: 1.0
  avg_time_to_capture: 0.8
  avg_min_distance: 0.5
  avg_motor_effort: 0.3
  pursuer_crash_rate: 0.0

# Heuristic seeds (first RL policy per role only). Names: hover, circular, pure_pursuit, apf, flee, fast_flee, weave, zigzag, switch forms: a>b@t
seed_heuristics:
  pursuer: [pure_pursuit, apf]
  evader: [circular, fast_flee, weave]

# Thesis F3: sampler for the pursuer's (RL) evader opponents. default = the multi-metric softmax above;
# hedge = Roncero et al. 2026 eq. (12); qd_dpp = Hedge quality x DPP diversity (needs behaviour stats in evals,
# i.e. eval_extra_overrides: [eval_cutoff_steps=1500]). The evader side always uses the default rule.
pursuer_sampler: default
hedge_gamma: 0.7
hedge_eta: 2.0
eval_extra_overrides: []           # extra hydra overrides for eval workers only
# Thesis F4: extra hydra overrides for the workers of one role only (train and eval), e.g. the pursuer's sensor
# restrictions vs the flags that let the evader's frozen pursuer opponents see the same inputs.
role_task_overrides:
  pursuer: []
  evader: []
