hydra:
  searchpath:
    - file://../cfg

headless: true

sim: ${task.sim}
env: ${task.env}

seed: 0
checkpoint: null
wandb_run_dir: null

eval:
  methods: [rl, pure_pursuit, pn, apf, kinematic_mpc, nonlinear_mpc]
  seeds: [0, 1, 2]
  num_envs: 512
  steps_per_env: 1024
  frames_per_batch_steps: 64
  max_iters: -1
  strict_fairness: true
  output_dir: outputs/evaluation
  scenarios:
    - name: hover
      trajectory_types: [hover]
      speed_range: [0.0, 0.0]
      spawn_distance_range: [0.5, 7.0]
    - name: linear
      trajectory_types: [linear]
      speed_range: [0.1, 5.0]
      spawn_distance_range: [0.5, 7.0]
    - name: random
      trajectory_types: [random]
      speed_range: [0.1, 5.0]
      spawn_distance_range: [0.5, 7.0]

viewer:
  # resolution: [960, 720]
  resolution: [1920, 1080]
  eye: [3.0, 0.0, 2.2]
  lookat: [0.0, 0.0, 1.6]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-benchmark
  job_type: evaluate
  entity: khairul-makirin-team
  project: RL Drone Interceptor
  mode: online
  run_id:
  monitor_gym: false
  tags: [benchmark, intercept]

defaults:
  - task: Intercept
  - algo: ppo
  - _self_
