hydra:
  searchpath:
    - file://../cfg

headless: true

sim: ${task.sim}
env: ${task.env}

seed: 0
checkpoint: null
wandb_run_dir: null

eval:
  methods: [rl, pure_pursuit, pn, kinematic_mpc, nonlinear_mpc]
  seeds: [0, 1, 2]
  num_envs: 512
  steps_per_env: 1024
  frames_per_batch_steps: 64
  max_iters: -1
  strict_fairness: true
  output_dir: outputs/evaluation
  scenarios:
    - name: hover_near_slow
      trajectory_types: [hover]
      speed_range: [1.0, 2.0]
      spawn_distance_range: [1.0, 3.0]
    - name: mixed_mid
      trajectory_types: [hover, linear, random]
      speed_range: [2.0, 4.0]
      spawn_distance_range: [2.0, 5.0]
    - name: aggressive_far
      trajectory_types: [linear, random, frpn, apf]
      speed_range: [4.0, 6.0]
      spawn_distance_range: [4.0, 7.0]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-benchmark
  job_type: evaluate
  entity: khairul-makirin-team
  project: RL Drone Interceptor
  mode: online
  run_id:
  monitor_gym: false
  tags: [benchmark, intercept]

defaults:
  - task: Intercept
  - algo: ppo
  - _self_
