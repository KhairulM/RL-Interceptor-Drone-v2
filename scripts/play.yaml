# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg

headless: true

sim: ${task.sim}
env:
  num_envs: 1
  max_episode_length: 1000 # 600
  env_spacing: 8

total_frames: 1_000_000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
frames_per_batch: 32

camera_record:
  enabled: false
  # Requires headless=false because camera annotators update while rendering.
  output_dir: outputs/play
  filename: null
  env_index: 0
  # 0 derives playback FPS from the collector batch cadence and simulation dt.
  fps: 0
  # 0 records every available frame; set a positive limit for short clips.
  max_frames: 0

# Optional path to a checkpoint (state_dict) to load before rollout in play.py.
# Override on the CLI with `checkpoint=/path/to/checkpoint_final.pt`.
checkpoint: null

# Optional JSON frozen-opponent pool for PursuitEvasion. The active policy is
# still loaded from `checkpoint`; this file supplies the other drone's policy.
opponent_spec_path: null

# When a checkpoint is given, play.py loads the training-config snapshot saved
# next to it (train_config.yaml, or W&B's files/config.yaml) and uses it as the
# task/algo/sim config, so the policy is always evaluated with the exact config
# it was trained on regardless of later edits to cfg/task/. Explicit CLI
# `task.*` / `algo.*` overrides still win. Set true to disable and compose the
# config purely from cfg/task/ instead.
ignore_trained_config: false

# Optional W&B run folder. If provided, play.py will load
# ${wandb_run_dir}/files/checkpoint_final.pt as the checkpoint.
# A fresh, dedicated play run is always created (the original run is not modified).
# Override with `wandb_run_dir=/path/to/wandb/run-YYYYMMDD_HHMMSS-<id>`.
wandb_run_dir: null

viewer:
  # resolution: [960, 720]
  resolution: [1280, 960]
  eye: [8, 0., 6.]
  lookat: [0., 0., 1.]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-play
  job_type: play
  entity: khairul-makirin-team
  project: RL Drone Interceptor
  mode: disabled # set to 'disabled' when debugging locally
  run_id:
  monitor_gym: True
  tags:

defaults:
  - task: Intercept
  - algo: ppo
  - _self_
