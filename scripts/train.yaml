# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg

headless: true

sim: ${task.sim}
env: ${task.env}

total_frames: 1_000_000_000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0

# Optional path to a checkpoint (state_dict) to load before rollout in play.py.
# Override on the CLI with `checkpoint=/path/to/checkpoint_final.pt`.
checkpoint: null

viewer:
  resolution: [960, 720]
  # The Crazyflie is only ~12 cm across (vs ~54 cm for the Hummingbird), so the
  # camera must sit close to it to be visible. Move `eye` farther out only when
  # visualizing larger drones or the whole swarm.
  eye: [3.0, 0.0, 2.2]
  lookat: [0.0, 0.0, 1.6]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  entity: khairul-makirin-team
  project: RL Drone Interceptor
  mode: online # set to 'disabled' when debugging locally
  run_id:
  monitor_gym: True
  tags:

defaults:
  - task: Intercept
  - algo: ppo
  - _self_
